- id: envicert
  name: Envicert integrity check
  description: Integrity verification and evidence for AI training/evaluation environments
  entry: envicert check
  language: python
  additional_dependencies: []
  types: [directory]
  pass_filenames: true
  args: ["--fail-on", "critical,high"]
  require_serial: true
- id: envicert-dataset
  name: Envicert dataset integrity check
  description: Leakage, duplication, split-overlap and label checks for JSONL/JSON/CSV datasets
  entry: envicert check
  language: python
  files: \.(jsonl|json|csv)$
  pass_filenames: true
  args: ["--adapter", "dataset"]
