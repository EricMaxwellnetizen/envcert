[build-system]
# hatchling >=1.28 emits Metadata-Version 2.5, which PyPI's upload toolchain
# still rejects; cap it until PyPI accepts 2.5.
requires = ["hatchling>=1.25,<1.28"]
build-backend = "hatchling.build"

[project]
name = "envcert"
version = "0.1.0"
description = "Independent, extensible integrity verification and evidence generation for AI training and evaluation environments"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "EnvCert contributors" }]
keywords = ["ai", "evaluation", "benchmark", "verification", "harbor", "attestation", "reward-hacking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
# Core is deliberately stdlib-only: static analysis works offline with no install footprint.
dependencies = []

[project.optional-dependencies]
validate = ["jsonschema>=4.20"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "jsonschema>=4.20", "build>=1.2", "twine>=5.0"]

[project.scripts]
envcert = "envcert.cli.main:main"

[project.urls]
Homepage = "https://github.com/EricMaxwellnetizen/envcert"
Repository = "https://github.com/EricMaxwellnetizen/envcert"
Issues = "https://github.com/EricMaxwellnetizen/envcert/issues"

[tool.hatch.build.targets.wheel]
packages = ["envcert"]

[tool.hatch.build.targets.sdist]
packages = ["envcert"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
files = ["envcert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["envcert"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
