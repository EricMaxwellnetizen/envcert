site_name: EnvCert
site_description: Integrity verification and evidence for AI training and evaluation environments
repo_url: https://github.com/EricMaxwellnetizen/envcert
theme:
  name: material
  features: [navigation.sections, search.suggest]
markdown_extensions: [tables, fenced_code, codehilite]
nav:
  - Home: index.md
  - Guides:
      - Quickstart: guides/QUICKSTART.md
      - Configuration: guides/CONFIGURATION.md
      - Dynamic execution: guides/DYNAMIC_EXECUTION.md
      - Datasets & cheat battery: guides/DATASETS_AND_CHEATS.md
      - CI: guides/CI.md
      - Writing a check: guides/WRITING_A_CHECK.md
      - Writing an adapter or runner: guides/WRITING_AN_ADAPTER_OR_RUNNER.md
  - Architecture:
      - Architecture: architecture/ARCHITECTURE.md
      - Check catalog: architecture/CHECK_CATALOG.md
      - Threat model: architecture/THREAT_MODEL.md
      - Report schema: architecture/REPORT_SCHEMA.md
      - Product decisions: architecture/PRODUCT_DECISIONS.md
  - Research:
      - Product review: research/PRODUCT_REVIEW.md
      - Competitive analysis: research/COMPETITIVE_ANALYSIS.md
      - Research findings: research/RESEARCH_FINDINGS.md
      - 0.4.0 pilot: research/PILOT_040.md
      - Public-environment pilot: research/PUBLIC_ENVIRONMENT_PILOT.md
  - Demo reports:
      - Safe task: demo/report-safe.md
      - Vulnerable task: demo/report-vulnerable.md
      - Dynamic + cheat battery: demo/report-dynamic.md
  - Releases:
      - v0.4.1: releases/v0.4.1.md
      - v0.4.0: releases/v0.4.0.md
      - v0.3.2: releases/v0.3.2.md
      - v0.3.1: releases/v0.3.1.md
      - v0.3.0: releases/v0.3.0.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md
