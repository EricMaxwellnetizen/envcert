# Copy into .github/workflows/envcert.yml in a task repository.
name: envcert
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  envcert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install EnvCert
        run: pip install envcert
      - name: "Check task (static, policy: fail on critical/high)"
        run: envcert check ./my-task --format json --output envcert-report.json
      - name: Verify report integrity
        if: success()
        run: envcert verify envcert-report.json --task ./my-task
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: envcert-report
          path: envcert-report.json
