# EnvCert with SARIF upload to GitHub code scanning.
name: envcert-sarif
on: [pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  envcert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install envcert
      - name: Run EnvCert and write SARIF
        run: envcert check ./my-task --format sarif --output envcert.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: envcert.sarif
      - name: Enforce policy
        run: envcert check ./my-task --quiet --format json --output envcert-report.json
