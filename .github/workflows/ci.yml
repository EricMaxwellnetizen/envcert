name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check envicert tests
      - run: mypy envicert
      - run: pytest --cov=envicert --cov-report=term
      - name: Smoke-test examples
        run: |
          envicert check examples/safe-environment
          envicert check examples/python-task --execution local-python --mutation
      - name: Build and install-check the package
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          envicert version
          envicert check examples/safe-environment --format json --output report.json
          envicert verify report.json --task examples/safe-environment
